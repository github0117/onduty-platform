services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ticket_agent
      POSTGRES_USER: ticket_agent
      POSTGRES_PASSWORD: ticket_agent
    ports:
      - "5432:5432"
    volumes:
      - ticket_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_agent -d ticket_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ticket_agent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ticket-agent-api:local
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    profiles: ["app"]
    env_file:
      - path: ../../.env
        required: false
    environment: &app-environment
      # 默认是本机演示栈；试点/生产部署通过 .env 覆盖为 production / oidc。
      APP_ENV: ${APP_ENV:-development}
      APP_AUTH_MODE: ${APP_AUTH_MODE:-dev}
      DATABASE_URL: postgresql+psycopg://ticket_agent:ticket_agent@postgres:5432/ticket_agent
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-33554432}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      TASK_MODE: celery
      MODEL_PROVIDER: openai_compatible
      # 主模型只认 MODEL_*：先前复用 ECOMMERCE_CONTENT_* 会让电商文案密钥在
      # 运维不知情时变成主模型密钥。密钥由 .env 注入，不写死在 compose 中。
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-qwen-plus}
      MODEL_FALLBACK_TO_LOCAL: "true"
      # 推荐语义嵌入；未填 EMBEDDING_API_KEY 时自动降级为 local-hash 演示模式，
      # 页面与 /metrics/rag 会标记 embedding_quality=demo。
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-text-embedding-v3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-true}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-20}
      EMBEDDING_FALLBACK_TO_LOCAL: ${EMBEDDING_FALLBACK_TO_LOCAL:-true}
      EMBEDDING_ALLOW_EMPTY_API_KEY: ${EMBEDDING_ALLOW_EMPTY_API_KEY:-false}
      # 远端 cross-encoder 重排：默认 local。切 external 需在 .env 填
      # RERANK_BASE_URL / RERANK_MODEL_NAME / RERANK_API_KEY（密钥只从 .env 注入）。
      KNOWLEDGE_RERANK_PROVIDER: ${KNOWLEDGE_RERANK_PROVIDER:-local}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL_NAME: ${RERANK_MODEL_NAME:-}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-3}
      RERANK_FALLBACK_TO_LOCAL: ${RERANK_FALLBACK_TO_LOCAL:-true}
      KNOWLEDGE_RERANK_MIN_CANDIDATES: ${KNOWLEDGE_RERANK_MIN_CANDIDATES:-1}
      KNOWLEDGE_RERANK_TRIGGER_SCORE: ${KNOWLEDGE_RERANK_TRIGGER_SCORE:-0}
      KNOWLEDGE_RERANK_MAX_CANDIDATES: ${KNOWLEDGE_RERANK_MAX_CANDIDATES:-30}
      CLAIM_VERIFIER_PROVIDER: local
      CLAIM_VERIFIER_FALLBACK_TO_LOCAL: "true"
      CLAIM_VERIFIER_ENFORCE: "false"
      # 混合检索开关：默认 dense，切换 hybrid 前先完成重索引回填。
      KNOWLEDGE_RETRIEVAL_MODE: ${KNOWLEDGE_RETRIEVAL_MODE:-dense}
      KNOWLEDGE_RRF_K: ${KNOWLEDGE_RRF_K:-60}
      KNOWLEDGE_CONTEXT_PRUNE_ENABLED: ${KNOWLEDGE_CONTEXT_PRUNE_ENABLED:-true}
      KNOWLEDGE_CONTEXT_MAX_CHARS: ${KNOWLEDGE_CONTEXT_MAX_CHARS:-5000}
      # 多轮上下文消解默认开启（无模型）；LLM 多查询默认关闭，开启后仅在低分
      # 查询触发，端点/密钥未显式配置时复用 MODEL_*。
      KNOWLEDGE_QUERY_CONTEXT_ENABLED: ${KNOWLEDGE_QUERY_CONTEXT_ENABLED:-true}
      KNOWLEDGE_QUERY_CONTEXT_HISTORY_TURNS: ${KNOWLEDGE_QUERY_CONTEXT_HISTORY_TURNS:-3}
      KNOWLEDGE_QUERY_REWRITE_ENABLED: ${KNOWLEDGE_QUERY_REWRITE_ENABLED:-false}
      KNOWLEDGE_QUERY_REWRITE_VARIANTS: ${KNOWLEDGE_QUERY_REWRITE_VARIANTS:-2}
      KNOWLEDGE_QUERY_REWRITE_TRIGGER_SCORE: ${KNOWLEDGE_QUERY_REWRITE_TRIGGER_SCORE:-0.3}
      KNOWLEDGE_QUERY_REWRITE_TIMEOUT_SECONDS: ${KNOWLEDGE_QUERY_REWRITE_TIMEOUT_SECONDS:-2}
      QUERY_REWRITE_BASE_URL: ${QUERY_REWRITE_BASE_URL:-}
      QUERY_REWRITE_API_KEY: ${QUERY_REWRITE_API_KEY:-}
      QUERY_REWRITE_MODEL_NAME: ${QUERY_REWRITE_MODEL_NAME:-}
      # 演示栈用本地卷保存素材，不依赖外部对象存储；接入 S3 兼容服务时
      # 将 provider 改为 s3 并按 .env.example 配置 S3_ENDPOINT_URL 等变量。
      OBJECT_STORAGE_PROVIDER: local
      OBJECT_STORAGE_LOCAL_ROOT: /var/lib/ticket-agent/objects
      TICKET_INTEGRATION_PROVIDER: http_json
      TICKET_API_BASE_URL: http://mock-business:8090
      ECOMMERCE_CHANNEL_PROVIDER: http_json
      ECOMMERCE_CHANNEL_BASE_URL: http://mock-business:8090
      LOGISTICS_QUERY_PROVIDER: http_json
      LOGISTICS_QUERY_BASE_URL: http://mock-business:8090/logistics/queries
      BUSINESS_SANDBOX_PROVIDER: http_json
      BUSINESS_SANDBOX_BASE_URL: http://mock-business:8090
      METRICS_SCRAPE_TOKEN: local-metrics-token
    # 升级前确认数据库版本可达（回滚后旧镜像碰到新库会立刻失败），升级后再确认
    # 恰好落在 head；api 依赖 service_completed_successfully，检查不过就不会启动。
    command:
      - sh
      - -c
      - >-
        python scripts/migration_preflight.py --allow-pending &&
        alembic upgrade head &&
        python scripts/migration_preflight.py --expect-head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ticket-agent-api:local
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    profiles: ["app"]
    env_file:
      - path: ../../.env
        required: false
    environment: *app-environment
    command:
      - uvicorn
      - ticket_agent.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ticket_agent_local_objects:/var/lib/ticket-agent/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-business:
        condition: service_healthy
      mock-business-mcp:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: nginx:latest
    profiles: ["app"]
    ports:
      - "5173:80"
    volumes:
      - ../../apps/web/dist:/usr/share/nginx/html:ro
      - ../nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-business:
    image: ticket-agent-api:local
    profiles: ["app", "test"]
    command:
      - uvicorn
      - mock_business_app:app
      - --app-dir
      - /app/scripts
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    ports:
      - "8090:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  mock-business-mcp:
    image: ticket-agent-api:local
    profiles: ["app", "test"]
    command:
      - python
      - /app/scripts/mock_business_mcp.py
    environment:
      MOCK_BUSINESS_BASE_URL: http://mock-business:8090
    ports:
      - "8091:8091"
    depends_on:
      mock-business:
        condition: service_healthy

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["test"]
    working_dir: /work
    environment:
      E2E_BASE_URL: http://web
      E2E_ARGS: ${E2E_ARGS:-}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ../../apps/web:/work
    command: ["sh", "-c", "npx playwright test $${E2E_ARGS:-}"]
    shm_size: "1gb"
    init: true
    depends_on:
      web:
        condition: service_healthy

  worker:
    image: ticket-agent-api:local
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    profiles: ["app"]
    ports: []
    env_file:
      - path: ../../.env
        required: false
    environment: *app-environment
    volumes:
      - ticket_agent_local_objects:/var/lib/ticket-agent/objects
    command:
      - celery
      - -A
      - ticket_agent.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
      mock-business:
        condition: service_healthy
      mock-business-mcp:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  beat:
    image: ticket-agent-api:local
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    profiles: ["app"]
    ports: []
    env_file:
      - path: ../../.env
        required: false
    environment: *app-environment
    command:
      - celery
      - -A
      - ticket_agent.workers.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/var/lib/ticket-agent/celerybeat-schedule
    volumes:
      - ticket_agent_beat:/var/lib/ticket-agent
    depends_on:
      redis:
        condition: service_healthy
      mock-business:
        condition: service_healthy
      mock-business-mcp:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  ticket_agent_pgdata:
  ticket_agent_redis:
  ticket_agent_local_objects:
  ticket_agent_beat:

